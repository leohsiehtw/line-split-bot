name = "line-split-bot"
main = "src/index.js"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "line-split-bot"
# 執行 `npx wrangler d1 create line-split-bot` 後，把它印出的 database_id 貼到這裡
database_id = "REPLACE_WITH_YOUR_DATABASE_ID"
migrations_dir = "migrations"

[observability]
enabled = true
