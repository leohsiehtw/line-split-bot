name = "line-split-bot"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "line-split-bot"
database_id = "9ace7412-cdc0-42d5-a696-c724005ba055"
migrations_dir = "migrations"

# 每天台灣時間 03:00 刪除機器人已離開超過 30 天的聊天室資料。
[triggers]
crons = ["0 19 * * *"]

[observability]
enabled = true
